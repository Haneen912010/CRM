
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
    <title>Customer Management</title>
</head>
<body>
    <header>
<h1 id="pageTitle">Customer Management</h1>
        <nav>
            <ul>
                <li><a href="#" id="dashboardLink">Dashboard</a></li>
                <li><a href="#" id="customersLink">Customers</a></li>
                <li><a href="#" id="addCustomerLink">Add Customer</a></li>
            </ul>
        </nav>

        <div class="header-controls">
            <button id="languageBtn" type="button">العربية</button>
            <button id="themeBtn" type="button">☀ Light Mode</button>
        </div>
    </header>

    <aside>
        <h2 id="sidebarTitle">Sidebar</h2>
        <ul>
            <li id="sidebarDashboard">Dashboard</li>
            <li id="settingsLink">Settings</li>
        </ul>
    </aside>

    <main>
        <section>
            <h2 id="customersTitle">Customers List</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th id="nameHeader" scope="col">Name</th>
                        <th id="phoneHeader" scope="col">Phone</th>
                        <th id="emailHeader" scope="col">Email</th>
                        <th id="statusHeader" scope="col">Status</th>
                        <th id="actionsHeader" scope="col">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Haneen Mohammed</td>
                        <td>01024294318</td>
                        <td>h8333832@gmail.com</td>
                        <td><button id="statusBtn">Active</button></td>
                        <td>
                            <button id="editBtn">Edit</button>
                            <button id="deleteBtn">Delete</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Mohammed</td>
                        <td>0102429</td>
                        <td>h83@gmail.com</td>
                        <td><button id="statusBt">Active</button></td>
                        <td>
                            <button id="editBt">Edit</button>
                            <button id="deleteBt">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2 id="formTitle">Add New Customer</h2>

            <form id="customerForm">
                <div>
                    <label id="nameLabel" for="name">Customer Name</label>
                    <input type="text" id="name14" name="name"
                        placeholder="Enter Customer name" required>
                </div>

                <div>
                    <label id="phoneLabel" for="Phone">Phone Number</label>
                    <input type="tel" id="Phone" name="Phone"
                        placeholder="Enter phone number" required>
                </div>

                <div>
                    <label id="emailLabel" for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter email address" required>
                </div>

                <div>
                    <label id="statusLabel" for="status">Status</label>
                    <select id="status" name="status">
                        <option value="active" id="activeOption">Active</option>
                        <option value="inactive" id="inactiveOption">Inactive</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn">Add Customer</button>
            </form>
        </section>
    </main>

    <footer>
        <p id="footerText">&copy; 2026 Customer Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
